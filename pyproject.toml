[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "echoloom"
version = "0.2.0"
description = "EchoLoom: event-driven multi-source AI Agent runtime with durable queues, episodic memory, and pluggable connectors"
readme = "README.md"
license = {text = "0BSD"}
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "google-adk==2.13.0", "google-genai==2.33.0", "openai==3.42.1", "SQLAlchemy[asyncio]==2.1.6", "httpx>=0.27,<1", "silk-python==0.2.9", "Pillow>=10.4,<13", "av==19.0.2", "pypdf>=5,<7"]

[project.scripts]
echoloom = "echoloom.cli:main"
echoloom-vault = "echoloom.local_config:main"
echoloom-credentials = "echoloom.credentials:main"
echoloom-dashboard = "echoloom.trace_dashboard:main"

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src/echoloom"]
check_untyped_defs = true
