# Multi-source connector registry template.
# Copy this file to `.local/sources.toml` (gitignored) to configure one or more
# inbound/outbound message & event sources concurrently.
#
# Each [[sources]] (or [sources.<id>]) entry registers an HTTP ingestion route
# at `POST /sources/<id>/events` and routes outbound replies back through that source.
# Legacy `POST /callback` continues routing to `default_source`.

default_source = "webhook"

[sources.webhook]
enabled = true
factory = "echoloom.connectors.webhook:WebhookConnector"
channel = "webhook"
account_id = "bot_local"
default_conversation_id = "room:general"
# Leave outbound_url empty for ingest-only mode, or point to an HTTP receiver / bridge.
outbound_url = ""
# Optional shared secret checked via `Authorization: Bearer <token>` or HMAC-SHA256.
auth_token_env = "ECHOLOOM_WEBHOOK_SECRET"
send_enabled = false

# Optional Telegram Bot API connector:
# [sources.telegram]
# enabled = false
# factory = "echoloom.connectors.telegram:TelegramConnector"
# channel = "telegram"
# account_id = "telegram-bot"
# auth_token_env = "ECHOLOOM_TELEGRAM_BOT_TOKEN"
# hmac_secret_env = "ECHOLOOM_TELEGRAM_SECRET_TOKEN"
# send_enabled = true

# Optional Feishu / Lark Open Platform connector:
# [sources.feishu]
# enabled = false
# factory = "echoloom.connectors.feishu:FeishuConnector"
# channel = "feishu"
# account_id = "feishu-bot"
# auth_token_env = "ECHOLOOM_FEISHU_TENANT_TOKEN"
# send_enabled = true
# [sources.feishu.options]
# app_id = ""
# app_secret = ""
# verification_token = ""

# Optional Discord Bot REST / relay connector:
# [sources.discord]
# enabled = false
# factory = "echoloom.connectors.discord:DiscordConnector"
# channel = "discord"
# account_id = "discord-bot"
# auth_token_env = "ECHOLOOM_DISCORD_BOT_TOKEN"
# send_enabled = true

# Example optional WeChat Hook connector (Windows desktop hook plugin):
# [sources.wechat]
# enabled = false
